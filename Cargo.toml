[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/market_data",
    "crates/storage",
    "crates/strategy",
    "crates/executor",
]
default-members = ["crates/executor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Abelardo Aguilar <auco1120@outlook.com>"]
repository = "https://github.com/Pseudeus/binance-crypto-db"
license = "GPL-2.0-only"
rust-version = "1.85"

[workspace.dependencies]
# Internal workspace crates
common = { path = "crates/common" }
market_data = { path = "crates/market_data" }
storage = { path = "crates/storage" }
strategy = { path = "crates/strategy" }
executor = { path = "crates/executor" }

# External crates
chrono = { version = "0.4.42", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", features = ["json"] }
futures-util = "0.3.31"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls-vendored"] }
polars = { version = "0.44.0", features = ["lazy", "temporal", "default"] }
tract-onnx = "0.22.0"
ndarray = "0.17.1"
ta = "0.5.0"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
url = "2.5.0"
dotenvy = "0.15.7"
teloxide = { version = "0.13", features = ["macros"] }
uuid = { version = "1.19.0", features = ["v4"] }
toml = { version = "1.1.2" }

# Production profile optimized for RISC-V edge execution
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Optimize external dependencies during local development
[profile.dev.package."*"]
opt-level = 2
